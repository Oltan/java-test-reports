# Defaults for the JUnit Platform Cucumber engine (CucumberTestRunner path).
# System properties (-Dcucumber.plugin=...) take precedence over this file,
# which is why the defaults live here instead of @ConfigurationParameter
# (annotations would override system properties and block per-run overrides).
# The retry path (RetryTestRunner -> Cucumber CLI Main) reads cucumber.properties instead.
cucumber.plugin=io.qameta.allure.cucumber7jvm.AllureCucumber7Jvm,com.testreports.allure.FailureLocationCapture,pretty
cucumber.glue=com.testreports.allure,com.testreports.steps
cucumber.publish.quiet=true
